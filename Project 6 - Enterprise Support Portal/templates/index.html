<!DOCTYPE html>                     <!-- tell browser the type so it reads using correct rules -->
<html>                              <!-- all code must be inside this tag -->
<head>                              <!-- contains info the user doesnt actually see -->
    <title>Enterprise Support Portal</title>    <!-- title of the tab -->
    <style>                         <!-- contains CSS, controlling font,colours and width -->
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>                              <!-- what the user actually sees -->

    <h1>Enterprise Support Portal</h1>              <!-- heading 1 -->
    <p>Live view of active ERP support tickets.</p>  <!-- paragraph -->

    <table>                         <!-- built row by row starting here -->
        <thead>                     <!-- table head -->
            <tr>                    <!-- table row -->
                <th>Ticket ID</th>  <!-- table header -->
                <th>Department</th> <!-- table header -->
                <th>Issue</th>      <!-- table header -->
                <th>Priority</th>   <!-- table header -->
                <th>Status</th>     <!-- table header -->
            </tr>                   <!-- table row end -->
        </thead>                    <!-- thead ends -->
        <tbody>                     <!-- table body contains, actual data -->
            
            <!-- This is the Flask magic. It loops through the tickets and creates a row for each one -->
            {% for ticket in tickets %}
            <tr>
                <td>{{ ticket[0] }}</td>    <!-- table data, double brackets prints the variable -->
                <td>{{ ticket[1] }}</td>    <!-- table data -->
                <td>{{ ticket[2] }}</td>    <!-- table data -->
                <td>{{ ticket[3] }}</td>    <!-- table data -->
                <td>{{ ticket[4] }}</td>    <!-- table data -->
            </tr>
            {% endfor %}            <!-- stops loop -->
            
        </tbody>
    </table>

</body>                         <!-- close tags -->
</html>
